buildscript {
  ext {
    springBootVersion = "4.1.1"
  }

  repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
    maven { url "https://plugins.gradle.org/m2/" }
  }

  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    classpath "com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.27"
    classpath "com.netflix.nebula:gradle-ospackage-plugin:11.11.2"
    classpath "org.owasp:dependency-check-gradle:12.1.3"
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven { url "https://repo.spring.io/release" }
  maven { url "https://repo.spring.io/milestone" }
  maven { url "https://repo.spring.io/snapshot" }
}

// Project.version info (upgrade version when needed)
group = "org.ihtsdo.refsetservice"
version = "1.2.2"

// Extra Properties
ext {

	// always use "-SNAPSHOT" for versionTag except for release commits
	versionTag = "-SNAPSHOT"
	versionNumber = version

	if (!project.hasProperty("debAppName")) {

		if (System.getenv("DEB_APP_NAME") != null) {
			debAppName = System.getenv("DEB_APP_NAME")
		} else {
			debAppName = "snomed-refset-service"
		}
	}

	if (!project.hasProperty("buildNumber")) {

		if (System.getenv("BUILD_NUMBER") != null) {
			buildNumber = "~" + System.getenv("BUILD_NUMBER")
		} else {
			buildNumber = ""
		}
	} else {
		buildNumber = "~" + buildNumber
	}

	// ignore the build number if this is not a Snapshot version
	if (versionTag != "-SNAPSHOT") {
		buildNumber = ""
	}

	// Parameters
	if (!project.hasProperty("inputName")) {
    	inputName = "na"
	}
	if (!project.hasProperty("filePath")) {
    	filePath = "na"
	}
}

// Plugins
apply plugin: "java"
apply plugin: "eclipse"
apply plugin: "com.github.spotbugs"
apply plugin: "org.springframework.boot"
apply plugin: "checkstyle"
/*
 * The dependency management plugin remains a transitive dependency of spring-boot-gradle-plugin
 * so there is no need for it to be listed as a classpath dependency in the buildscript configuration.
 */
apply plugin: "io.spring.dependency-management"
apply plugin: "maven-publish"
apply plugin: "application"
apply plugin: "com.netflix.nebula.deb"
apply plugin: "com.netflix.nebula.ospackage"
apply plugin: "org.owasp.dependencycheck"

application {
    mainClass = "org.ihtsdo.refsetservice.Application"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

ext['tomcat.version'] = '11.0.26'

// apply the version tag to the project.version
version = version + versionTag

springBoot {
    // generate file META-INF/build-info.properties during the build
    // TODO: need an explanation of why/what this is for
    buildInfo()
}

configurations.all {
   exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
   resolutionStrategy {
    force "com.google.guava:guava:33.0.0-jre"
    force "commons-beanutils:commons-beanutils:1.11.0"
   }
}

ospackage {

	packageName = debAppName
	// apply the build number to the ospackage.version
    version = versionNumber + buildNumber

	println '***** project.name: ' + project.name
	println '***** project.version: ' + project.version
	println '***** debAppName: ' + debAppName
	println '***** versionNumber: ' + versionNumber
	println '***** buildNumber: ' + buildNumber
	println '***** ospackage version: ' + version

    from('build/libs') {
	    into "/opt/${debAppName}/"
	    rename { String fileName ->
	    		println '***** fileName: ' + fileName
	            fileName.replace("-${project.version}", "")
    	}
 	}

	from('src/debian/control') {
		into '/DEBIAN/'
	}

	link("var/log/${debAppName}", "/var/opt/${debAppName}/log")
}

// Dependencies - https://docs.gradle.org/current/userguide/declaring_dependencies.html
dependencies {

  // NOTE: "spring-boot-starter-webmvc" must be the first dependency
  implementation "org.springframework.boot:spring-boot-starter-webmvc"

  // resteasy required for delete api call with entity
  implementation "org.jboss.resteasy:resteasy-client:7.0.5.Final"
  implementation "org.jboss.resteasy:resteasy-jackson2-provider:7.0.5.Final"

  implementation "org.springframework.boot:spring-boot-starter-log4j2"
  developmentOnly "org.springframework.boot:spring-boot-devtools"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-cache"
  implementation "org.springframework.boot:spring-boot-properties-migrator"
  implementation "org.springframework.boot:spring-boot-starter-jdbc"
  implementation "org.springframework.boot:spring-boot-starter-tomcat"
  implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
  implementation "org.springframework.boot:spring-boot-starter-flyway"
  implementation "org.springframework.boot:spring-boot-starter-aspectj"
  implementation "org.springframework.boot:spring-boot-jackson2"
  implementation "org.springframework.security:spring-security-core"
  implementation "org.springframework.security:spring-security-crypto"
  implementation "org.springframework.security:spring-security-web"
  implementation "org.springframework.cloud:spring-cloud-starter-consul-config"
  implementation "org.springframework.cloud:spring-cloud-starter-consul-discovery"
  implementation "org.springframework.cloud:spring-cloud-starter-vault-config"
  implementation "org.springframework:spring-aop"
  implementation "org.bouncycastle:bcprov-jdk18on:1.78"
  implementation "joda-time:joda-time:2.12.7"

  // Database
  implementation "org.flywaydb:flyway-mysql"
  implementation "com.mysql:mysql-connector-j:26.7.0"

  // Hibernate ORM 7 (Boot-managed) + Search 8.4 (BOM)
  implementation "org.hibernate.orm:hibernate-core"
  implementation "org.hibernate.orm:hibernate-hikaricp"
  implementation "org.hibernate.search:hibernate-search-mapper-orm"
  implementation "org.hibernate.search:hibernate-search-backend-lucene"
  implementation "org.hibernate.search:hibernate-search-backend-elasticsearch"
  // implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate7:2.22.2"
  implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate7"

  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1"
  implementation "org.apache.commons:commons-text:1.10.0"
  implementation "org.reflections:reflections:0.9.11"
  implementation "jakarta.ws.rs:jakarta.ws.rs-api"
  implementation "org.eclipse.angus:jakarta.mail:2.0.5"
  implementation "jakarta.xml.bind:jakarta.xml.bind-api"
  implementation "org.glassfish.jaxb:jaxb-runtime"
  implementation "commons-cli:commons-cli:1.4"
  implementation "commons-io:commons-io:2.16.1"
  implementation "com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider"
  implementation "com.amazonaws:aws-java-sdk-s3:1.12.797"

  implementation "javax.cache:cache-api"
  implementation "org.ehcache:ehcache:3.10.8:jakarta"

  // Security
  implementation "com.auth0:java-jwt:3.8.3"
  implementation "com.auth0:jwks-rsa:0.9.0"

  // runtime only
  testRuntimeOnly "com.h2database:h2"

  // test dependencies
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation "net.bytebuddy:byte-buddy:1.18.14"
  spotbugs "com.github.spotbugs:spotbugs:4.10.4"
  testImplementation "org.testcontainers:mysql:1.20.0"
  testImplementation "org.testcontainers:junit-jupiter:1.20.0"
  testImplementation "com.github.dasniko:testcontainers-keycloak:3.7.0"
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.3"
    mavenBom "org.hibernate.search:hibernate-search-bom:8.4.0.Final"
  }
}

// SpotBugs and CheckStyle
spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    excludeFilter = file("config/spotbugs/exclude.xml")
}
spotbugsMain {
    enabled = true
    reports {
        xml.required = false
        html.required = true
    }
}
spotbugsTest {
    enabled = true
    reports {
        xml.required = false
        html.required = true
    }
}

checkstyle {
  toolVersion = "13.10.0"
  ignoreFailures = true
  checkstyleMain.exclude "**/package-info.java"
  checkstyleTest.exclude "**/package-info.java"

  configProperties = [
    "checkstyle.cache.file"         : rootProject.file(".out/checkstyle/checkstyle.cache"),
    "checkstyle.suppressions.file"  : rootProject.file("config/checkstyle/suppressions.xml"),
    "checkstyle.header.file"        : "",
    "checkstyle.regexp.header.file" : "",
    "checkstyle.importcontrol.file" : ""
  ]
}
tasks.withType(Checkstyle) {
  ignoreFailures = true
  reports {
    xml.required = false
    html.required = true
    html.stylesheet resources.text.fromFile("config/checkstyle/checkstyle-report.xsl")
  }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    format = 'JSON'
    outputDirectory = file("$buildDir/reports/dependency-check")
    suppressionFile = file("dependencies.xml")
    scanConfigurations = ['productionRuntimeClasspath']
    analyzers {
        ossIndex {
            enabled = false
        }
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
    }
}

test {
   // Use junit platform for unit tests
   systemProperty "spring.profiles.active", "test"
   useJUnitPlatform()
   exclude "**/*IntegrationTest*"
   jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED"
}

// Live / external-system tests. Not part of default ./gradlew test.
// Example: source .work/mt2-dev/.env-local && export SNOMED_SNOWSTORM_REST_BASE_URL=$SNOMED_SNOWSTORM_BASE_URL
//          ./gradlew integrationTest --tests org.ihtsdo.refsetservice.rest.test.MappingWorkflowSnowstormIntegrationTest
task integrationTest(type: Test) {
   description = "Runs *IntegrationTest* classes (e.g. live Snowstorm). Not part of default test."
   group = "verification"
   testClassesDirs = sourceSets.test.output.classesDirs
   classpath = sourceSets.test.runtimeClasspath
   systemProperty "spring.profiles.active", "test"
   useJUnitPlatform()
   include "**/*IntegrationTest*"
   shouldRunAfter test
   jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED"
   testLogging {
      events "passed", "skipped", "failed"
      exceptionFormat "full"
      showCauses true
      showStackTraces true
   }
}

bootRun {
   classpath = sourceSets.main.runtimeClasspath.filter {
      !it.name.contains("spring-boot-devtools")
   }
   jvmArgs "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5555"
}

// Rebuild Hibernate Search / Elasticsearch indexes from the DB.
// Prefer with MT2 jar stopped (or before traffic) after SQL seed / ES wipe.
//   ./gradlew reindex
//   ./gradlew reindex -PindexedObjects=MapSet
//   ./gradlew reindex -PindexedObjects=MapSet,Refset
task reindex(type: JavaExec) {

   // Match bootRun: exclude spring-boot-devtools so RestartClassLoader does not
   // make @Indexed Class objects differ from those in the EntityManagerFactory mapping.
   classpath = sourceSets.main.runtimeClasspath.filter {
      !it.name.contains("spring-boot-devtools")
   }
   mainClass = "org.ihtsdo.refsetservice.ReindexApplication"
   systemProperties System.getProperties()
   if (project.hasProperty("indexedObjects")) {
      args(project.property("indexedObjects"))
   }
   jvmArgs "-Xmx8G"
}

// ./gradlew migrateRttRefset -PfilePath=src/test/resources/migration/refset/GeneralDentistrySingleVersion.txt
task migrateRttRefset(type: JavaExec) {

   classpath = sourceSets.main.runtimeClasspath
   mainClass = "org.ihtsdo.refsetservice.GeneratorApplication"
   systemProperties System.getProperties()
   // arguments to pass to the application
   args ("migrateRttRefset")
   jvmArgs "-Xmx8G"
}

// Uncomment the manifest entry to specify the start class
bootJar {
  //  manifest {
  //    attributes "Start-Class": "org.ihtsdo.refsetservice.application.AbcApplication"
  // }
}

// We can launch via spring boot by simply running "java -jar *.jar"
task install(dependsOn: 'publishToMavenLocal')

tasks.named("startScripts").configure { dependsOn("bootJar") }
tasks.named("distTar").configure { dependsOn("bootJar") }
tasks.named("distZip").configure { dependsOn("bootJar") }
tasks.named("buildDeb").configure { dependsOn("bootJar", "jar") }
