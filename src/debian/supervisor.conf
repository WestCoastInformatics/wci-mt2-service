[program:snomed-refset-service]
user = refset-service
directory = /var/opt/%(program_name)/run
command = /usr/bin/java -Xms256m -Xmx2500m  -jar /opt/%(program_name)/%(program_name).jar -Drun.config=/etc/opt/%(program_name)/config.properties -httpPort=10002 -resetExtract -extractDirectory /var/opt/%(program_name)/run/extract
autostart = true
autorestart = true
stdout_logfile_backups=5
stderr_logfile_backups=5
stdout_logfile_maxbytes=10485760
stderr_logfile_maxbytes=10485760