
#
# Test Properties
#
# Unique CacheManager name per context to avoid "Another CacheManager with same name already exists" when multiple tests run in same JVM
ehcache.cache.manager.name=cache-${random.uuid}
test.conceptCodeList=${CONCEPT_CODE_LIST:C7073}
springProfiles=test
crowd.unit.test.skip=true
auth.dev.bypass=true
server.servlet.context-path=/

### uncomment the below to run tests for Edition, Organization, Team, Project and User Controllers.
# Spring Session Properties
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./build/unittestdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=password
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout.seconds=900
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#
### Jpa-Hibernate Datasource Configuration
spring.jpa.properties.hibernate.hbm2ddl.auto=create
spring.jpa.properties.hibernate.connection.driver_class=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.connection.url=jdbc:h2:file:./build/unittestdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.jpa.properties.hibernate.connection.username=sa
spring.jpa.properties.hibernate.connection.password=password
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
hibernate.search.backend.lucene_version=8.7.0
hibernate.search.configuration_property_checking.strategy=ignore

##
### Flyway Configuration
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
flyway.database.name=unittestdb
flyway.user=sa
flyway.password=password
flyway.url=jdbc:h2:file:./build/unittestdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
flyway.locations=classpath:db/migration
spring.flyway.placeholders.pre_if_exists=
spring.flyway.placeholders.post_if_exists=if exists
spring.flyway.placeholders.create_mapping_events_seq=
spring.flyway.placeholders.auto_increment=BIGINT auto_increment
spring.flyway.placeholders.jsonb=text
### uncomment the above to run tests for Edition, Organization, Team, Project and User Controllers.

# Terminology handler: MapSet workflow tests require SNOMED_SNOWSTORM (workflow delegates to handler)
terminology.handler=SNOMED_SNOWSTORM
terminology.handler.SNOMED_SNOWSTORM.username=${SNOMED_SNOWSTORM_USERNAME:test}
terminology.handler.SNOMED_SNOWSTORM.password=${SNOMED_SNOWSTORM_PASSWORD:test}
terminology.handler.SNOMED_SNOWSTORM.authType=${SNOMED_SNOWSTORM_AUTH_TYPE:cookie}
terminology.handler.SNOMED_SNOWSTORM.authUrl=${SNOMED_SNOWSTORM_AUTH_URL:https://dev-ims.ihtsdotools.org/api/}
terminology.handler.SNOMED_SNOWSTORM.restBaseUrl=${SNOMED_SNOWSTORM_REST_BASE_URL:https://snowstorm.terminology.tools/}
terminology.handler.SNOMED_SNOWSTORM.fhirBaseUrl=${SNOMED_SNOWSTORM_FHIR_BASE_URL:none}
terminology.handler.SNOMED_SNOWSTORM.dir=${SNOMED_SNOWSTORM_DIR:./build/test-terminology}

# Lucene Configuration
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.schema_management.strategy=create
spring.jpa.properties.hibernate.search.backend.directory.root=./build/indexes
##spring.jpa.properties.hibernate.search.automatic_indexing.synchronization.strategy=read-sync

# Terminology handler for tests: MapSetWorkflowTestHandler returns dummy getBranchVersions (no Snowstorm)
terminology.handler=MAPSET_WORKFLOW_TEST
terminology.handler.MAPSET_WORKFLOW_TEST.class=org.ihtsdo.refsetservice.rest.test.util.MapSetWorkflowTestHandler
